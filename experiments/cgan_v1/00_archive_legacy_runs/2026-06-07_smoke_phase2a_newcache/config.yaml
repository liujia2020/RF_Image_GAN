run_name: 2026-06-07_smoke_phase2a_newcache
track: cgan_v1
status: smoke_newcache_reader_restored_amplitude
hypothesis: >
  Run a minimal Phase2a training-loop smoke on the rebuilt normalized fp16
  cache, with the project reader restoring true RF amplitudes before network
  and loss computation.

data:
  cache_dir: /home/liujia/rf_training_cache/cgan_phase2a_64x32x32_random_full1500_fp16_cache_20260607
  train_split: train
  val_split: val
  test_split: test
  legacy_code_dir: /media/liujia/8CC24D13C24D02C6/code/RF_Image_GAN/RF_Image_regression
  categories: [carotid, muscle, phantom]

sampler:
  type: stratified_category_batch_sampler
  samples_per_category: 1
  effective_batch_size: 3
  shuffle: true
  seed: 20260607
  purpose: keep carotid/muscle/phantom present in each smoke batch

generator:
  model_class: TinyResidualRFNet
  use_bn: true
  init: random

discriminator:
  model_class: Envelope2DPatchDiscriminator
  ndf: 64
  input: [candidate_or_label_envelope_y_slice, baseline_envelope_y_slice]
  y_slice: random_per_iteration

loss:
  type: lsgan_struct_carrier
  lambda_adv: 1.0
  lambda_struct: 10.0
  lambda_carrier: 0.5
  structural_term: L1(LP(env(pred)), LP(env(label)))
  carrier_term: L1(pred, label)
  lowpass:
    type: anisotropic_gaussian_3d
    sigma_voxels:
      z: 6.0
      x: 3.0
      y: 3.0
    truncate: 3.0

training:
  enabled: true
  note: Minimal smoke only; no quality conclusion and no formal checkpoint output.
  smoke_iterations: 2
  batch_candidates: [3]
  min_batch_size: 3
  lr_G: 2.0e-4
  lr_D: 2.0e-4
  beta1: 0.5
  beta2: 0.999
  num_workers: 0
  cache_return_fp16: true
  tensor_compute_dtype: fp32_after_h2d
  use_amp: false
  d_steps_per_g: 1

diagnostics:
  report_batch_amplitude: true
  stop_on_nonfinite_loss: true

outputs:
  logs_dir: experiments/cgan_v1/runs/2026-06-07_smoke_phase2a_newcache/logs
  figures_dir: experiments/cgan_v1/runs/2026-06-07_smoke_phase2a_newcache/figures
  checkpoints_dir: experiments/cgan_v1/runs/2026-06-07_smoke_phase2a_newcache/checkpoints
