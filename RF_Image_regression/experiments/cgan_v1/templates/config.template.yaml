# Copy this file into a run folder as config.yaml before training.
# Training must use the copied config, not this template.

run:
  name: "YYYY-MM-DD_short_name"
  created_at: "YYYY-MM-DD HH:MM:SS +08:00"
  task: "describe the run"
  git_commit: "REPLACE_ME"
  seed: 20260522

data:
  train_cache: "Data_cache_random64_full1500/train"
  val_cache: "Data_cache_random64_full1500/val"
  test_cache: "Data_cache_random64_full1500/test"
  include_categories: ["carotid", "muscle", "phantom"]
  patch_shape: [64, 32, 32]
  normalize: true

generator:
  name: "REPLACE_ME"
  in_channels: 1536
  baseline_channels: 2
  out_channels: 2

discriminator:
  name: "REPLACE_ME"
  input_domain: "envelope"
  conditional_on: "baseline_envelope"

loss:
  complex_l1_weight: 1.0
  abs_l1_weight: 0.1
  adversarial_weight: 0.0
  feature_matching_weight: 0.0

training:
  batch_size: 1
  num_epochs: 1
  lr_g: 0.0001
  lr_d: 0.0001
  weight_decay: 0.0
  amp: true
  num_workers: 0

validation:
  export_nii: true
  require_slicer_review: true
  metrics:
    - complex_l1
    - abs_l1
    - psnr
    - speckle_snr
    - histogram_ks
    - seam
